<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentForge Generated App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Generated Task Board</h1>
        <p>php, html, MySQL, Tailwind CSS, JS</p>
      </header>
      <form id="task-form">
        <input id="task-input" required placeholder="Describe a task..." />
        <button type="submit">Add task</button>
      </form>
      <ul id="task-list" aria-live="polite"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
